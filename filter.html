<!DOCTYPE html>
<html lang="en"><head><title>Tutor Match - Filter</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body>
<div class="phone">
  <header class="phone-header">Tutor Match</header>
  <main class="phone-main">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 m-0">Filter</h1>
      <button id="clearBtn" type="button" class="btn btn-outline-secondary btn-sm rounded-pill">Clear all</button>
    </div>

    <fieldset class="tm-section">
      <legend class="tm-section-title">Subject</legend>
      <div class="d-flex flex-wrap gap-2">
        <input type="checkbox" class="btn-check" name="subject" id="subScience" value="Science"><label class="chip" for="subScience">Science</label>
        <input type="checkbox" class="btn-check" name="subject" id="subSocial" value="Social Studies"><label class="chip" for="subSocial">Social Studies</label>
        <input type="checkbox" class="btn-check" name="subject" id="subMath" value="Math"><label class="chip" for="subMath">Math</label>
        <input type="checkbox" class="btn-check" name="subject" id="subLang" value="Language Arts"><label class="chip" for="subLang">Language Arts</label>
        <input type="checkbox" class="btn-check" name="subject" id="subEnglish" value="English"><label class="chip" for="subEnglish">English</label>
      </div>
    </fieldset>

    <fieldset class="tm-section">
      <legend class="tm-section-title">Age group</legend>
      <div class="d-flex flex-wrap gap-2">
        <input type="checkbox" class="btn-check" name="age" id="ageElem" value="Elementary"><label class="chip" for="ageElem">Elementary</label>
        <input type="checkbox" class="btn-check" name="age" id="ageHigh" value="High school"><label class="chip" for="ageHigh">High school</label>
        <input type="checkbox" class="btn-check" name="age" id="ageCollege" value="College"><label class="chip" for="ageCollege">College</label>
      </div>
    </fieldset>

    <div class="tm-section">
      <label class="tm-section-title d-block" for="priceRange">Price range: up to $<span id="priceValue">100</span>/hr</label>
      <input type="range" id="priceRange" class="form-range" min="15" max="100" value="100">
      <div class="d-flex justify-content-between small text-secondary"><span>$15</span><span>$100</span></div>
    </div>

    <div class="tm-section">
      <label class="tm-section-title d-block" for="distRange">Distance: within <span id="distValue">50</span> km</label>
      <input type="range" id="distRange" class="form-range" min="1" max="50" value="50">
      <div class="d-flex justify-content-between small text-secondary"><span>1 km</span><span>50 km</span></div>
    </div>

    <button id="applyBtn" type="button" class="btn btn-tm w-100">Apply</button>
  </main>
  <div id="navbar-placeholder"></div>
</div>
<script type="module" src="/js/filter.js"></script>
<script type="module" src="/js/navbar.js"></script>
</body></html>
