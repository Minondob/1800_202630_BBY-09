
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TutorMatch - Tutors</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <header class="container py-3">
        <nav class="d-flex justify-content-between align-items-center">
            <a class="text-dark fs-4" aria-label="Menu">
                <i class="bi bi-list"></i>
            </a>

            <h1 class="h3 mb-0">TutorMatch</h1>

            <a class="text-dark fs-4" aria-label="Settings">
                <i class="bi bi-gear"></i>
            </a>
        </nav>
    </header>

    
    <section class="container mb-4">

        <div class="input-group">
            <span class="input-group-text bg-light border-0">
                <i class="bi bi-search"></i>
            </span>

            <input
                type="search"
                class="form-control bg-light border-0"
                id="tm-search"
                placeholder="Search by Subject, Tutors, Price..."
            >
        </div>
    </section>

   
    <main class="container tm-tutors py-3">

        <div class="row g-1">

            
            <div class="col-6">
                <div class="tm-card card h-100 text-center py-2">

                    <img
                        src="https://cdn.phototourl.com/member/2026-10-20-b7beafba-cc94-4a4f-8b06-ec4381091b25.jpg"
                        class="rounded-circle mx-auto mb-2"
                        width="100"
                        height="100"
                        alt="Alex Hogfield"
                    >

                    <div class="card-body p-1">
                        <h2 class="tm-name h6">Alex Hogfield</h2>
                        <p class="small mb-2">Math <br> Physics</p>

                        <a href="profile.html" class="btn btn-secondary btn-sm rounded-pill">
                            View Profile
                        </a>
                    </div>

                </div>
            </div>

            
            <div class="col-6">
                <div class="tm-card card h-100 text-center p-2">

                    <img
                        src="https://cdn.phototourl.com/member/2026-10-20-9505950d-49dc-4738-911a-cbb4e46b485f.jpg"
                        class="rounded-circle mx-auto mb-1"
                        width="100"
                        height="100"
                        alt="Jerry Crawford"
                    >

                    <div class="card-body p-1">
                        <h2 class="tm-name h6">Jerry Crawford</h2>
                        <p class="small mb-2">Chemistry</p>

                        <a href="profile.html"
                         id="tm-jerry-profile"
                         class="btn btn-secondary btn-sm rounded-pill">
                            View Profile
                        </a>
                    </div>

                </div>
            </div>

           
            <div class="col-6">
                <div class="tm-card card h-100 text-center p-2">

                    <img
                        src="https://cdn.phototourl.com/member/2026-10-20-9229a151-4dd4-4587-8bfc-0b7b3d2bfe46.jpg"
                        class="rounded-circle mx-auto mt-1"
                        width="100"
                        height="100"
                        alt="Chris Karth"
                    >

                    <div class="card-body p-2">
                        <h2 class="tm-name h6">Chris Karth</h2>
                        <p class="small mb-2">English</p>

                        <a href="profile.html" class="btn btn-secondary btn-sm rounded-pill">
                            View Profile
                        </a>
                    </div>

                </div>
            </div>

            
            <div class="col-6">
                <div class="tm-card card h-100 text-center p-2">

                    <img
                        src="https://cdn.phototourl.com/member/2026-10-20-c7fd7e72-3c77-498f-a143-5aede12910ac.jpg"
                        class="rounded-circle mx-auto mt-1"
                        width="100"
                        height="100"
                        alt="Bryan Travis"
                    >

                    <div class="card-body p-2">
                        <h2 class="tm-name h6">Bryan Travis</h2>
                        <p class="small mb-2">Biology</p>

                        <a href="profile.html" class="btn btn-secondary btn-sm rounded-pill">
                            View Profile
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </main>
<script src="tutors.js"></script>
</body>
</html>
