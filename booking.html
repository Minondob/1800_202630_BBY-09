<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutor Match - Booking Request</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>
  <header class="tm-head container-fluid text-center py-4 border-bottom border-5">
    <a href="index.html" class="tm-back position-absolute start-0 ms-4 text-dark">
      <i class="bi bi-chevron-left"></i>
    </a>
    <h1 class="tm-title h4">Student Booking <br> Request Form</h1>
  </header>
  <main class="tm-main container py-5">
    <form id="tm-booking-form">
      <h2 class="h6 mb-2">Student Info</h2>
      <div class="mb-3">
        <textarea class="form-control" id="tm-student-info" rows="6"
          placeholder="Describe the subjects you need help with..." required></textarea>
      </div>
      <div class="mb-3">
        <label for="tm-education" class="form-label fw-semibold">Student Level of Education</label>
        <select class="form-select" id="tm-education" required>
          <option value="" selected disabled>Select your education level</option>
          <option value="grade lower than 5">Elementary-School</option>
          <option value="grade 6-10">Middle-School</option>
          <option value="grade 11-12">High-School Grade 12</option>
          <option value="college">College</option>
          <option value="university">University</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="tm-student-name" class="form-label fw-semibold">Student's Full Name</label>
        <input type="text" class="form-control" id="tm-student-name" placeholder="Enter your name" required>
      </div>
      <div id="booking-message" class="mb-3"></div>
      <button type="submit" class="btn btn-secondary w-100">Submit Booking Request</button>
    </form>

    <!-- NEW: past booking requests are shown here -->
    <section class="mt-5">
      <h2 class="h5 mb-3">Your past booking requests</h2>
      <div id="past-requests">Loading...</div>
    </section>
  </main>
  <script type="module" src="/js/booking.js"></script>
</body>
</html>
