<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
</head>
<body>
    <nav class="navbar bg-body-secondary">
    <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">Tutor Match</a>
    </div>
    </nav>

    <div class="container my-4">
  <h1 class="h3 mb-4">Log in</h1>

  <div class="mb-3">
    <label for="loginEmail" class="form-label">Email</label>
    <input type="email" id="loginEmail" class="form-control">
  </div>
  <div class="mb-3">
    <label for="loginPassword" class="form-label">Password</label>
    <input type="password" id="loginPassword" class="form-control">
  </div>

  <button type="button" id="loginBtn" class="btn btn-primary w-100 mb-2">Log in</button>
  <button type="button" id="logoutBtn" class="btn btn-outline-secondary w-100">Log out</button>
  <p id="statusMsg" class="mt-3"></p>
</div>

<script type="module" src="/src/login.js"></script>
</body>
