<!DOCTYPE html>
<html lang="en"><head><title>Tutor Match - Sign up</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body>
<div class="phone">
  <header class="phone-header">Tutor Match</header>
  <main class="phone-main">
    <h1 class="h4 mb-4" id="heading">Account set-up</h1>
    <div id="error" class="alert alert-danger d-none" role="alert"></div>
    <form id="signupForm" novalidate>
      <label class="form-label" for="firstName">First name</label>
      <input id="firstName" class="form-control mb-3" required>
      <label class="form-label" for="lastName">Last name</label>
      <input id="lastName" class="form-control mb-3" required>
      <label class="form-label" for="email">Email</label>
      <input id="email" type="email" class="form-control mb-3" required>
      <label class="form-label" for="password">Password (6+ characters)</label>
      <input id="password" type="password" class="form-control mb-4" minlength="6" required>
      <button id="createBtn" type="submit" class="btn btn-tm w-100">Create account</button>
    </form>
  </main>
  <div id="navbar-placeholder"></div>
</div>
<script type="module" src="js/signup.js"></script>
</body></html>
