
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Card Payment - Tutor Match</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="phone">

        <!-- Header -->
        <header class="phone-header">
            Tutor Match
        </header>

        <!-- Main Content -->
        <main class="phone-main">

            <h2 class="text-center mb-4">Card Details</h2>

            <form id="cardDetailsForm" class="card-form p-3">

                <!-- Cardholder Name -->
                <div class="mb-3">
                    <label for="cardholderName" class="form-label">
                        Cardholder Name
                    </label>

                    <input
                        type="text"
                        id="cardholderName"
                        class="form-control"
                        placeholder="Enter cardholder name"
                        required
                    >
                </div>

                <!-- Card Number -->
                <div class="mb-3">
                    <label for="cardNumber" class="form-label">
                        Card Number
                    </label>

                    <input
                        type="text"
                        id="cardNumber"
                        class="form-control"
                        placeholder="Enter card number"
                        inputmode="numeric"
                        required
                    >
                </div>

                <!-- Expiry Date -->
                <div class="mb-3">
                    <label for="expiryDate" class="form-label">
                        Expiry Date
                    </label>

                    <input
                        type="text"
                        id="expiryDate"
                        class="form-control"
                        placeholder="MM/YY"
                        required
                    >
                </div>

                <!-- CVC -->
                <div class="mb-3">
                    <label for="cvc" class="form-label">
                        CVC
                    </label>

                    <input
                        type="text"
                        id="cvc"
                        class="form-control"
                        placeholder="Enter CVC"
                        inputmode="numeric"
                        required
                    >
                </div>

                <!-- Continue Button -->
                <button
                    type="submit"
                    class="btn btn-tm w-100"
                >
                    Continue
                </button>

            </form>

        </main>

        <!-- Bottom Navigation -->
        <div id="navbar-placeholder"></div>

    </div>

    <!-- Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Navbar -->
    <script src="/js/navbar.js"></script>

    <!-- Card Payment JavaScript -->
    <script type="module" src="/js/card-details.js"></script>

</body>
</html>
