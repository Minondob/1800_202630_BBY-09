<!DOCTYPE html>
<html lang="en"><head><title>Tutor Match - Choose your role</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body>
<div class="phone">
  <header class="phone-header">Tutor Match</header>
  <main class="phone-main d-flex flex-column gap-3 justify-content-center">
    <h1 class="h4">Are you a:</h1>
    <button id="studentBtn" class="role-btn">Student?</button>
    <p class="text-center text-secondary m-0">or a:</p>
    <button id="tutorBtn" class="role-btn">Tutor?</button>
  </main>
  <div id="navbar-placeholder"></div>
</div>
<script>
  // Remember the choice for the sign-up page.
  function choose(role) { sessionStorage.setItem("role", role); location.href = "signup.html"; }
  document.getElementById("studentBtn").addEventListener("click", () => choose("student"));
  document.getElementById("tutorBtn").addEventListener("click", () => choose("tutor"));
</script>
</body></html>
