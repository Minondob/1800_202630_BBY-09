
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutorMatch - Inbox</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #F5F7FB;
            font-family: Arial, sans-serif;
            color: #242E70;
        }

        /* Header */
        .tm-head {
            background-color: #242E70;
            color: white;
        }

        /* Main content */
        .inbox-main {
            max-width: 950px;
            margin: 35px auto;
            padding: 0 15px;
        }

        /* Inbox section */
        .inbox-card {
            background-color: white;
            border: 1px solid #E3E8F2;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(36, 46, 112, 0.06);
        }

        /* Section headings */
        .section-title {
            font-weight: bold;
            color: #242E70;
            margin-bottom: 20px;
        }

        /* Booking request cards */
        .request-card {
            background-color: white;
            border: 1px solid #E3E8F2;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 18px;
        }

        .request-name {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .request-details p {
            margin-bottom: 10px;
        }

        /* Action buttons */
        .tm-button {
            border: none;
            border-radius: 7px;
            padding: 10px 22px;
            color: white;
            font-weight: bold;
        }

        .accept-button {
            background-color: #198754;
        }

        .decline-button {
            background-color: #DC3545;
        }

        /* Smaller screens */
        @media (max-width: 576px) {
            .inbox-card {
                padding: 18px;
            }

            .request-card {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Page header -->
    <header class="tm-head container-fluid py-4 border-bottom border-5">
        <div class="container">
            <h1 class="mb-0">TutorMatch</h1>
            <p class="mb-0 mt-2">Tutor Inbox</p>
        </div>
    </header>

    <main class="inbox-main">

        <!-- Booking requests section -->
        <section class="inbox-card">
            <h2 class="section-title">Booking Requests</h2>

            <!-- Messages will appear here -->
            <div id="inbox-message"></div>

            <!-- Booking requests will appear here -->
            <div id="booking-requests">
                <p class="text-muted mb-0">
                    Your booking requests will appear here.
                </p>
            </div>
        </section>

    </main>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Inbox JavaScript -->
    <script type="module" src="/src/inbox.js"></script>

</body>
</html>
