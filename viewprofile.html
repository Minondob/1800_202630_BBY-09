<!DOCTYPE html>
<html lang="en"><head><title>Tutor Match - Tutor profile</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/tutors.css" rel="stylesheet"></head>
<body>
<div class="phone">
  <header class="d-flex justify-content-between align-items-center p-3">
    <a href="alltutors.html" class="text-dark fs-4" aria-label="Back to tutors"><i class="bi bi-chevron-left"></i></a>
    <button type="button" data-message class="btn p-0 fs-3" aria-label="Message tutor"><i class="bi bi-envelope"></i></button>
  </header>
  <main class="phone-main pt-0 text-center">
    <p id="status" class="text-secondary">Loading...</p>
    <section id="tutor" class="d-none">
      <div class="profile-hero mb-3"><img id="avatar" class="avatar" alt="Tutor photo"></div>
      <h1 class="h4 fw-bold" id="name"></h1>
      <h2 class="h6">Tutor Details</h2>
      <p class="bio-box" id="bio"></p>
      <h2 class="h6">Tutor Subject(s):</h2>
      <p><span class="subject-chip" id="subject"></span></p>
      <h2 class="h6">Tutor Rating:</h2>
      <p class="stars mb-0" id="stars"></p>
      <small id="ratingNote" class="text-secondary d-block mb-3"></small>
      <div class="d-flex gap-2 justify-content-center">
        <button type="button" data-message class="btn btn-pill">Message Tutor</button>
        <a id="bookBtn" href="booking.html" class="btn btn-pill">Book a Session</a>
      </div>
    </section>
  </main>
  <div id="navbar-placeholder"></div>
</div>
<script type="module" src="js/viewprofile.js"></script>
</body></html>
