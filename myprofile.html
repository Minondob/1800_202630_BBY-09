<!DOCTYPE html>
<html lang="en"><head><title>Tutor Match - My profile</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body>
<div class="phone">
  <header class="phone-header">Tutor Match</header>
  <main class="phone-main">
    <p id="loading" class="text-secondary">Loading your profile...</p>
    <section id="profile" class="text-center d-none">
      <img id="avatar" class="avatar mb-3" alt="Your avatar">
      <h1 class="h4 mb-1" id="username"></h1>
      <p class="text-secondary mb-3" id="role"></p>
      <p class="text-start" id="bio"></p>
      <p class="text-secondary small" id="email"></p>
      <a href="profile.html" class="btn btn-outline-primary rounded-pill w-100 mb-2">Edit profile</a>
      <button id="logoutBtn" type="button" class="btn btn-tm w-100">Log out</button>
    </section>
  </main>
  <div id="navbar-placeholder"></div>
</div>
<script type="module" src="js/myprofile.js"></script>
</body></html>
