<!DOCTYPE html>
<html lang="en"><head><title>Tutor Match - Log in</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body>
<div class="phone">
  <header class="phone-header">Tutor Match</header>
  <main class="phone-main">
    <h1 class="h4 mb-4">Log in</h1>
    <label class="form-label" for="loginEmail">Email</label>
    <input type="email" id="loginEmail" class="form-control mb-3">
    <label class="form-label" for="loginPassword">Password</label>
    <input type="password" id="loginPassword" class="form-control mb-4">
    <button type="button" id="loginBtn" class="btn btn-tm w-100 mb-2">Log in</button>
    <button type="button" id="logoutBtn" class="btn btn-outline-secondary rounded-pill w-100">Log out</button>
    <p id="statusMsg" class="mt-3 small text-secondary" role="status"></p>
    <p class="text-center mt-4">New here? <a href="main.html">Create an account</a></p>
  </main>
  <div id="navbar-placeholder"></div>
</div>
<script type="module" src="/js/login.js"></script>
</body></html>
