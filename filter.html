
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filter Tutors</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
</head>
<body>
    <nav class="navbar bg-body-secondary">
    <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">Tutor Match</a>
    </div>
    </nav>
  <div class="container my-4">
    <h1 class="h3 mb-4">Filter Tutors</h1>

    <div class="mb-3">
      <label for="subjectInput" class="form-label">Subject</label>
      <input type="text" id="subjectInput" class="form-control" placeholder="e.g. Calculus II">
    </div>

    <div class="mb-3">
      <label for="ageGroupSelect" class="form-label">Age group</label>
      <select id="ageGroupSelect" class="form-select">
        <option value="">Any</option>
        <option>Elementary</option>
        <option>High school</option>
        <option>University</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="priceRange" class="form-label">
        Max price: $<span id="priceValue">50</span>/hr
      </label>
      <input type="range" id="priceRange" class="form-range" min="10" max="100" value="50">
    </div>

    <div class="mb-3">
      <label for="distanceSelect" class="form-label">Distance</label>
      <select id="distanceSelect" class="form-select">
        <option value="">Any</option>
        <option>Within 5 km</option>
        <option>Within 10 km</option>
        <option>Online only</option>
      </select>
    </div>

    <button id="applyFiltersBtn" class="btn btn-primary w-100">Apply filters</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const priceRange = document.getElementById("priceRange");
    priceRange.addEventListener("input", () => {
      document.getElementById("priceValue").textContent = priceRange.value;
    });

    document.getElementById("applyFiltersBtn").addEventListener("click", () => {
      console.log("Apply filters clicked");
    });
  </script>
</body>
</html>
