<!DOCTYPE html>
<html lang="en"><head><title>Tutor Match - My profile</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body>
<div class="phone">
  <header class="phone-header">Tutor Match</header>
  <main class="phone-main">
    <p id="loading" class="text-secondary">Loading your profile...</p>
    <section id="profile" class="text-center d-none">
      <img id="avatar" class="avatar mb-3" alt="Your avatar">
      <h1 class="h4 mb-1" id="username"></h1>
      <p class="text-secondary mb-3" id="role"></p>
      <p class="fw-bold d-none" id="rate"></p>
      <p class="text-start" id="bio"></p>
      <p class="text-secondary small" id="email"></p>
      <a href="profile.html" class="btn btn-outline-primary rounded-pill w-100 mb-2">Edit profile</a>
      <button id="logoutBtn" type="button" class="btn btn-tm w-100">Log out</button>
      <button id="deleteBtn" type="button" class="btn btn-outline-danger rounded-pill w-100 mt-3">Delete account</button>
      <div id="deletePanel" class="alert alert-danger text-start mt-3 d-none" role="alertdialog" aria-labelledby="deleteTitle">
        <p id="deleteTitle" class="fw-bold mb-1">Delete your account?</p>
        <p class="small">This permanently removes your profile and your booking requests. It can't be undone.</p>
        <label class="form-label small" for="deletePassword">Enter your password to confirm</label>
        <input id="deletePassword" type="password" class="form-control mb-2" autocomplete="current-password">
        <p id="deleteError" class="small text-danger d-none" role="alert"></p>
        <button id="confirmDeleteBtn" type="button" class="btn btn-danger rounded-pill w-100 mb-2">Yes, delete my account</button>
        <button id="cancelDeleteBtn" type="button" class="btn btn-outline-secondary rounded-pill w-100">Cancel</button>
      </div>
    </section>
  </main>
  <div id="navbar-placeholder"></div>
</div>
<script type="module" src="js/myprofile.js"></script>
<script type="module" src="/js/navbar.js"></script>
</body></html>
