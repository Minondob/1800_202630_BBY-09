<!DOCTYPE html>
<html lang="en"><head><title>Tutor Match - Set up profile</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body>
<div class="phone">
  <header class="phone-header">Tutor Match</header>
  <main class="phone-main">
    <section id="profileSection">
      <h1 class="h4 mb-4" id="heading">Set up your profile</h1>
      <div id="error" class="alert alert-danger d-none" role="alert"></div>
      <div class="text-center mb-4">
        <img id="avatarPreview" class="avatar mb-3" alt="Your avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
        <input id="avatarInput" type="file" accept="image/*" class="d-none">
        <div><button id="avatarBtn" type="button" class="btn btn-outline-primary rounded-pill">Select avatar</button></div>
      </div>
      <fieldset class="mb-4">
        <legend class="fs-6 fw-bold">Select profile username:</legend>
        <div id="usernameOptions"></div>
      </fieldset>
      <label class="form-label fw-bold" for="bio" id="bioLabel">Profile details</label>
      <textarea id="bio" class="form-control mb-4" rows="4" placeholder="Write something about yourself and your education level"></textarea>
      <button id="saveBtn" type="button" class="btn btn-tm w-100">Save</button>
    </section>
    <section id="thanks" class="text-center d-none pt-5">
      <h1 class="h3">Thank you for signing up!</h1>
      <p class="text-secondary">Your profile is saved.</p>
    </section>
  </main>
  <div id="navbar-placeholder"></div>
</div>
<script type="module" src="js/profile.js"></script>
</body></html>
